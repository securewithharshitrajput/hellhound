name: release

# Builds prebuilt binaries for every tagged version and attaches them to a
# GitHub Release, so hellhound can be used without a Go toolchain.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Check the tag matches the version in the source
        run: |
          want="v$(grep -oE 'const Version = "[^"]+"' internal/banner/banner.go | cut -d'"' -f2)"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match source version $want" >&2
            exit 1
          fi

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="hellhound_${GITHUB_REF_NAME#v}_${os}_${arch}"
            bin="hellhound"; [ "$os" = "windows" ] && bin="hellhound.exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "build/$name/$bin" ./cmd/hellhound
            cp README.md LICENSE "build/$name/"
            if [ "$os" = "windows" ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "hellhound $GITHUB_REF_NAME" --generate-notes
